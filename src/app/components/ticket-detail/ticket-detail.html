<div class="flex flex-col max-w-sm mx-auto my-auto mt-10 ring-2 ring-gray-300 dark:text-gray-400 dark:ring-gray-600 p-2 rounded-t-md mb-10 shadow-xl">
    <div class="flex flex-col items-center md:flex-row md:justify-between h-20 m-1">
        <div class="relative h-20">
            <img [src]="ticket().customerImage" [alt]="ticket().customerName" class="h-20 w-20 object-cover rounded-full" sizes="(max-width: 768px) 100vw, 50vw"/>
        </div>

        <p>{{ ticket().title }}</p>
    </div>

    <hr class="h-px my-4 bg-gray-200 border-0"/>
    <div class="w-full">
        <div class="">
            <p class="text-sm mt-2 mb-2 flex items-center justify-between">
                <span>Customer Name</span>
                <span class="text-start">{{ ticket().customerName }}</span>
            </p>
            <p class="text-sm mt-2 mb-2 flex items-center justify-between">
                <span>Customer Email</span>
                <span class="text-start">{{ ticket().customerEmail }}</span>
            </p>
            <p class="text-sm mt-2 mb-2 flex items-center justify-between">
                <span>Customer Phone</span>
                <span class="text-start">{{ ticket().customerPhone }}</span>
            </p>
            <div class="text-sm mt-2 mb-2 flex items-center justify-between">
                <p>Notes</p>
                <p class="text-start">{{ ticket().description}}</p>
            </div>
        </div>
        <hr class="h-px my-4 bg-gray-200 border-0"/>
        <div class="flex flex-col items-center gap-2 md:flex-row md:justify-between h-full mb-5 mt-5">
            <button class="px-2 py-1 bg-white text-indigo-900 border border-indigo-900 hover:bg-indigo-900 hover:text-white font-bold w-full md:w-1/2 text-center rounded-md">
                <a routerLink="/tickets" >Back</a>
            </button>

            <button (click)="openModal()" class="px-2 py-1 bg-white text-rose-900 border border-rose-900 hover:bg-rose-900 hover:text-white font-bold w-full md:w-1/2 text-center rounded-md">
                Delete
            </button>
        </div>

    </div>
</div>

<app-modal-dialog
        [isOpen]="isModalOpen()"
        [title]="'Delete User Confirmation!'"
        (click)="closeModal()"
>
    <!-- Content passed into the modal's ng-content -->
    <p class="text-2xl leading-relaxed text-gray-500 dark:text-gray-400">
        Do you really want to delete ticket : {{ ticket().title }} belonging to customer : {{ticket().customerName}}?
    </p>
    <button (click)="deleteTicket()" class="mt-4 px-4 py-2 border border-rose-900 bg-rose-900 text-white hover:bg-white hover:text-rose-900 font-bold rounded">
        Confirm
    </button>
</app-modal-dialog>
