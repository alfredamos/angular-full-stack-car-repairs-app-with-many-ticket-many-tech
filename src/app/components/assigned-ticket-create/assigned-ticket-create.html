<form class="flex flex-col max-w-sm shadow-2xl px-10 py-8 mx-auto rounded-lg mt-20 ring ring-gray-300">
    <h4 class="text-center text-xl font-bold mb-4">Ticket Create Form</h4>
    <div class="mb-3 flex-col items-center">
        <label for="techId" class="text-base">Technician</label>
        <select class="w-full max-w-xs ring-1 ring-gray-300 rounded-md" [formField]="ticketCreateForm.techId">
            <option>Select Technician</option>
            @for (tech of techs(); track tech.id) {
                <option [value]="tech.id" [id]="tech.id">{{tech.name}}</option>
            }
        </select>
    </div>
    <div class="mb-3 flex-col items-center">
        <label for="ticketId" class="text-base">Customer</label>
        <select class="w-full max-w-xs ring-1 ring-gray-300 rounded-md" [formField]="ticketCreateForm.ticketId">
            <option>Select Ticket</option>
            @for (ticket of tickets(); track ticket.id) {
                <option [value]="ticket.id" [id]="ticket.id">{{ticket.title}}</option>
            }
        </select>
    </div>
    <div class="flex flex-col md:flex-row items-center md:justify-between mt-6 md:gap-2">
        <button type="button" class="py-2 border-2 border-yellow-900 px-4 hover:bg-yellow-900 hover:text-white text-yellow-900 font-bold rounded-lg w-full md:w-1/2 mb-2" (click)="backToList()">Back</button>
        <button type="button" class="py-2 px-4 border-2 border-indigo-900 hover:bg-indigo-900 hover:text-white text-indigo-900 font-bold rounded-lg w-full md:w-1/2 mb-2" (click)="submitTicketCreateForm($event)">Save</button>
    </div>
</form>
